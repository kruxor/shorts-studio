# nginx vhost for Shorts Studio. Copy into /etc/nginx/sites-available/ and
# symlink into sites-enabled. Keep this file in sync with what is deployed.
#
# Local TLS here is self-signed on 7443 because tailscaled owns 443 and 8443 on
# this host. On a public server use 443 with a real certificate.
server {
    listen 80;
    listen [::]:80;
    listen 7443 ssl;
    listen [::]:7443 ssl;
    server_name shorts-studio.local;

    ssl_certificate     /etc/ssl/certs/shorts-studio.local.crt;
    ssl_certificate_key /etc/ssl/private/shorts-studio.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/shorts-studio.local/public;
    index index.html;
    charset utf-8;

    client_max_body_size 1024m;

    access_log /var/log/nginx/shorts-studio.local.access.log;
    error_log  /var/log/nginx/shorts-studio.local.error.log;

    # A first visit pulls ~112 MB (77 MB of weights + 35 MB of ONNX runtime).
    # Compressing the text-heavy parts matters more than it looks: tokenizer.json
    # alone is 2.1 MB of JSON.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm text/css text/plain image/svg+xml;

    # Weights and the ONNX runtime are pinned for a given build, so cache them for
    # a year. NOTE: `immutable` tells browsers not to revalidate at all. If you
    # replace a model or runtime file, bump the directory name
    # (whisper-base.en-v2, ort-v2) rather than expecting clients to notice.
    location ~* ^/(models|vendor)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fonts and images shipped with the app are equally static.
    location ~* ^/assets/.*\.(ttf|otf|woff2|png|jpg|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # App code changes with every release: revalidate so updates land immediately.
    # These files are small, so the revalidation round trip is cheap.
    location ~* \.(html|js|mjs|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
