# CloudPanel "Vhost" snippets for Shorts Studio.
#
# Create the site as **Static Site** (not PHP Site): there is no PHP, no
# database and no upload endpoint, so a PHP site would only add a php-fpm
# pool and a .php handler that can never serve anything.
#
# Paste these locations into the site's Vhost editor, ABOVE the existing
# `location / { ... }` block. Order matters: nginx regex locations are matched
# in order and the first match wins, so `^/(models|vendor)/` must come before
# any generic static-asset rule CloudPanel ships.
#
# IMPORTANT: CloudPanel's default static vhost usually contains something like
#   location ~* \.(js|css|png|jpg|...)$ { expires 1y; }
# That rule does two harmful things to this app: it caches app.js for a year
# (so a release never reaches a returning visitor), and it does not match .mjs,
# which then falls through to `location /` and is served as
# application/octet-stream. Delete that block once these are in place.

    # mime.types has no .mjs entry. Without this the app is silently dead: the
    # browser refuses a module script served as octet-stream, app.js never runs,
    # and drag/drop plus the file picker stop working with only a console line
    # about a "JavaScript-or-Wasm module script" to show for it.
    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Weights and runtime are pinned per build (77 MB + 35 MB). immutable means
    # browsers stop revalidating, so replacing one means bumping its directory
    # name (whisper-base.en-v2, ort-v2).
    location ~* ^/(models|vendor)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/assets/.*\.(ttf|otf|woff2|png|jpg|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # App code changes every release: revalidate so updates land immediately.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

# Also confirm gzip is on for the text half of the payload. A first visit is
# ~112 MB, and tokenizer.json alone is 2.1 MB of JSON that compresses to a
# fraction. CloudPanel enables gzip globally, so check rather than assume:
#
#   curl -sS -o /dev/null -D - -H 'Accept-Encoding: gzip' \
#     https://shorts.kruxor.com/models/whisper-base.en/tokenizer.json | grep -i content-encoding
#
# Nothing here needs client_max_body_size raised: video never leaves the
# browser, so no request body is ever large.
